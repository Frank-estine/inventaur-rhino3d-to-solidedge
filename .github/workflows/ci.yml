name: Inventaur Inc. — Rhino3D to Solid Edge CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  inventaur-python-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run host-independent tests
        run: python -m pytest -q
      - name: Compile Python modules
        run: python -m compileall -q Scripts tests

  inventaur-solidedge-mcp-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build Solid Edge MCP control server
        run: dotnet build Scripts/SOLIDEDGE-MCP/upstream/src/SolidEdge.Spy.McpServer/SolidEdge.Spy.McpServer.csproj --configuration Release
      - name: Build Solid Edge MCP event server
        run: dotnet build Scripts/SOLIDEDGE-MCP/upstream/src/SolidEdge.Spy.EventMcp/SolidEdge.Spy.EventMcp.csproj --configuration Release
