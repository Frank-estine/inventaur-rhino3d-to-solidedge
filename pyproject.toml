[project]
name = "inventaur-rhino3d-to-solidedge"
version = "1.0.0b3"
description = "Inventaur Inc. by Krishna Parmar — deterministic Rhino3D block-to-Solid Edge part and assembly workflow"
authors = [{name = "Krishna Parmar"}]
requires-python = ">=3.11"
dependencies = [
    "psutil>=5.9.8,<8",
    "pywin32>=306; platform_system == 'Windows'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["Scripts"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[project.urls]
Homepage = "https://inventaur.in"
